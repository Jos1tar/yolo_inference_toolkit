name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[cpu,dev]"
      - run: ruff check .
      - run: pytest -m "not models"

  parity:
    runs-on: ubuntu-latest
    needs: unit
    env:
      YOLOKIT_REQUIRE_MODELS: "1"  # fail, don't skip, if models or fixtures are missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: system libs (ultralytics pulls in full opencv-python, which needs libGL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[cpu,ref,dev]"
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/fetch_models.py') }}
      - run: make models
      - name: parity (torch reference vs onnxrt / openvino)
        run: |
          pytest -m models -s
          yk parity models/*.onnx --backends onnxrt,openvino --markdown >> "$GITHUB_STEP_SUMMARY"
